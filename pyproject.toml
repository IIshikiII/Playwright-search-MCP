[project]
name = "plsearch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "mcp[cli]>=1.27.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.26.0",
    "pytest-playwright>=0.7.2",
]


[tool.setuptools]
package-dir = {"" = "src"}
packages = ["plsearch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
addopts = "-s"
