[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plsearch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "beautifulsoup4>=4.14.3",
    "dotenv>=0.9.9",
    "mcp[cli]>=1.27.1",
    "playwright>=1.59.0",
    "psutil>=5.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.26.0",
    "pytest-playwright>=0.7.2",
]


[project.scripts]
plsearch = "plsearch.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["plsearch", "plsearch.cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
addopts = "-s"
